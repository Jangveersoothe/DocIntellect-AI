spring:
  application:
    name: docintellect-ai
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docintellect}
    username: ${DB_USER:docintellect}
    password: ${DB_PASSWORD:change-me}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 105MB
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  documents:
    max-file-size-bytes: 10485760
    max-batch-files: 10
  security:
    jwt:
      secret: ${JWT_SECRET}
      ttl-seconds: ${JWT_TTL_SECONDS:3600}
    bootstrap-owner:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  rag:
    chunk-size-tokens: 500
    chunk-overlap-tokens: 50
    top-k: 5

logging:
  level:
    com.jangveer.docintellect: INFO
