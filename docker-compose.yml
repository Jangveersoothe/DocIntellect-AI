services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docintellect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-docintellect}
      POSTGRES_USER: ${DB_USER:-docintellect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-docintellect} -d ${DB_NAME:-docintellect}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: docintellect-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-models:
    image: ollama/ollama:latest
    container_name: docintellect-ollama-models
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull llama3.2 && ollama pull nomic-embed-text"
    environment:
      OLLAMA_HOST: ollama:11434
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docintellect-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-docintellect}
      DB_USER: ${DB_USER:-docintellect}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully

volumes:
  postgres-data:
  ollama-data:
